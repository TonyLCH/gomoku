<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋 Gomoku - 線上對戰</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='35%' cy='30%'><stop offset='0%' stop-color='%23666'/><stop offset='40%' stop-color='%23222'/><stop offset='100%' stop-color='%23000'/></radialGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)' stroke='%231a0f04' stroke-width='4'/><ellipse cx='22' cy='20' rx='8' ry='5' fill='rgba(255,255,255,0.25)' transform='rotate(-30 22 20)'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- 粒子系統背景 -->
  <div class="bg-layer">
    <div class="bg-board-glow"></div>
    <canvas id="decoCanvas" class="deco-canvas"></canvas>
  </div>

  <!-- 粒子系統畫布 -->
  <canvas id="particleCanvas" class="particle-canvas"></canvas>

  <div class="container">

    <!-- ====== 主選單 ====== -->
    <div id="mainMenu" class="fade-in visible">
      <div class="menu-header">
        <div class="title-stones">
          <div class="deco-stone black">
            <div class="deco-stone-shine"></div>
          </div>
          <div class="title-block">
            <h1>五子棋</h1>
            <p class="subtitle">GOMOKU</p>
            <div class="title-ornament">
              <span class="orn-line"></span>
              <span class="orn-diamond">◆</span>
              <span class="orn-line"></span>
            </div>
          </div>
          <div class="deco-stone white">
            <div class="deco-stone-shine"></div>
          </div>
        </div>
      </div>

      <div class="menu-grid">
        <!-- AI 對戰 -->
        <div class="menu-card" id="aiCard">
          <div class="card-corner tl"></div>
          <div class="card-corner tr"></div>
          <div class="card-corner bl"></div>
          <div class="card-corner br"></div>
          <div class="card-icon-wrap">
            <div class="card-icon">
              <div class="icon-brain">
                <span class="icon-stone s1"></span>
                <span class="icon-stone s2"></span>
                <span class="icon-stone s3"></span>
              </div>
            </div>
          </div>
          <h2>人機對戰</h2>
          <p>挑戰智能 AI，磨練棋藝</p>
          <div class="difficulty-selector">
            <button class="diff-btn active" data-diff="easy">簡單</button>
            <button class="diff-btn" data-diff="medium">中等</button>
            <button class="diff-btn" data-diff="hard">困難</button>
          </div>
          <div class="ai-mode-buttons">
            <button class="btn btn-primary btn-stone" id="startAiBlack">
              <span class="dot-stone black"></span> 執黑先行
            </button>
            <button class="btn btn-outline btn-stone" id="startAiWhite">
              <span class="dot-stone white"></span> 執白後行
            </button>
          </div>
        </div>

        <!-- 線上對戰 -->
        <div class="menu-card" id="onlineCard">
          <div class="card-corner tl"></div>
          <div class="card-corner tr"></div>
          <div class="card-corner bl"></div>
          <div class="card-corner br"></div>
          <div class="card-icon-wrap">
            <div class="card-icon">
              <div class="icon-globe">⚔️</div>
            </div>
          </div>
          <h2>線上對戰</h2>
          <p>跨地區配對，與真實玩家對弈</p>
          <div class="name-input-wrap">
            <input type="text" id="playerNameInput" placeholder="輸入你的暱稱" maxlength="12">
          </div>
          <button class="btn btn-secondary btn-full" id="btnEnterLobby">
            <span>⚔️</span> 進入大廳
          </button>
        </div>
      </div>

      <p class="menu-footer">橫 · 豎 · 斜 — 連成五子者勝</p>
    </div>

    <!-- ====== 線上大廳 ====== -->
    <div id="lobbyScreen" class="lobby-screen hidden">
      <div class="lobby-card fade-in" id="lobbyCard">
        <div class="card-corner tl"></div>
        <div class="card-corner tr"></div>
        <div class="card-corner bl"></div>
        <div class="card-corner br"></div>
        <div class="lobby-card-icon">🌐</div>
        <h2>線上對戰大廳</h2>
        <div class="lobby-info">
          <span class="badge badge-connected" id="lobbyConnBadge">已連接</span>
          <span id="lobbyPlayerName" style="opacity:0.55;font-size:0.85rem;"></span>
        </div>
        <div class="lobby-divider"></div>
        <div class="lobby-actions">
          <button class="btn btn-primary btn-full btn-lg" id="btnStartMatch">⚔️ 開始匹配</button>
          <button class="btn btn-outline btn-full" id="btnLobbyBack">← 返回主選單</button>
        </div>
      </div>
    </div>

    <!-- ====== 配對中畫面 ====== -->
    <div id="matchingScreen" class="lobby-screen hidden">
      <div class="lobby-card fade-in" id="matchingCard">
        <div class="card-corner tl"></div>
        <div class="card-corner tr"></div>
        <div class="card-corner bl"></div>
        <div class="card-corner br"></div>
        <h2>尋找對手中</h2>
        <div class="matching-dots">
          <div class="matching-dot"></div>
          <div class="matching-dot"></div>
          <div class="matching-dot"></div>
        </div>
        <p style="opacity:0.55;margin-bottom:20px;">正在為你匹配實力相當的對手</p>
        <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.85rem;opacity:0.4;margin-bottom:16px;">
          ⏱ <span id="matchingPlayerName"></span>
        </div>
        <button class="btn btn-outline btn-full" id="btnCancelMatch">取消匹配</button>
      </div>
    </div>

    <!-- ====== 遊戲畫面 ====== -->
    <div id="gameScreen" class="hidden">
      <div class="game-header">
        <div class="game-header-left">
          <button class="btn btn-ghost" id="btnBackToMenu2">← 返回</button>
          <div class="header-divider"></div>
          <h1 id="gameTitle">人機對戰</h1>
        </div>
        <div class="game-header-right">
          <span class="status-badge my-turn" id="gameStatusBadge">
            <span class="status-dot pulse"></span> 輪到你了
          </span>
          <span class="online-badge hidden" id="onlineBadge">
            <span class="online-dot"></span> 線上
          </span>
          <button class="sound-toggle" id="btnSoundToggle" title="音效開關">🔊</button>
        </div>
      </div>

      <div class="game-main">
        <div class="game-board-section">
          <div class="board-frame">
            <div class="board-frame-inner">
              <canvas id="boardCanvas"></canvas>
            </div>
          </div>

          <div class="player-info-bar">
            <div class="player-info" id="blackPlayerInfo">
              <div class="player-info-stone black"><div class="pis-shine"></div></div>
              <div class="player-info-text">
                <div class="name" id="blackPlayerName">你</div>
                <div class="color-label">黑棋</div>
              </div>
              <div class="player-turn-dot" id="blackTurnDot" style="display:none;"></div>
            </div>
            <div class="move-counter">
              <div class="count" id="moveCount">0</div>
              <div class="label">手</div>
            </div>
            <div class="player-info" id="whitePlayerInfo">
              <div class="player-info-stone white"><div class="pis-shine"></div></div>
              <div class="player-info-text">
                <div class="name" id="whitePlayerName">AI</div>
                <div class="color-label">白棋</div>
              </div>
              <div class="player-turn-dot" id="whiteTurnDot" style="display:none;"></div>
            </div>
          </div>
        </div>

        <div class="side-panel" id="sidePanel">
          <div class="side-card" id="sideActions">
            <div class="side-card-title">遊戲操作</div>
            <div class="side-actions" id="aiActions">
              <button class="btn btn-outline btn-full" id="btnRestart">重新開始</button>
              <button class="btn btn-outline btn-full" id="btnSwapColor">換色重開</button>
            </div>
            <div class="side-actions hidden" id="onlineActions">
              <button class="btn btn-danger btn-full" id="btnSurrender">認輸</button>
            </div>
            <div class="side-actions hidden" id="onlineRematchActions">
              <button class="btn btn-outline btn-full" id="btnRematch">再來一局</button>
            </div>
          </div>

          <div class="side-card">
            <div class="side-card-title">落子記錄</div>
            <div class="move-log" id="moveLog">
              <div class="move-log-empty">暫無落子</div>
            </div>
          </div>

          <div class="side-card hidden" id="chatPanel">
            <div class="side-card-title">對局聊天</div>
            <div class="chat-messages" id="chatMessages">
              <div class="chat-empty">暫無消息</div>
            </div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="輸入訊息" maxlength="100">
              <button class="chat-send-btn" id="btnSendChat">發送</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== 結果彈窗 ====== -->
    <div id="resultOverlay" class="overlay hidden">
      <div class="overlay-content">
        <div class="overlay-icon win-black" id="resultIcon">♚</div>
        <h2 id="resultTitle">恭喜你贏了！</h2>
        <p class="overlay-desc" id="resultDesc"></p>
        <div class="overlay-actions" id="resultActions">
          <button class="btn btn-primary" id="btnPlayAgain">再來一局</button>
          <button class="btn btn-outline" id="btnOverlayMenu">返回主選單</button>
        </div>
      </div>
    </div>

    <!-- ====== 確認彈窗 ====== -->
    <div id="confirmOverlay" class="overlay hidden">
      <div class="confirm-content">
        <div class="confirm-icon" id="confirmIcon">?</div>
        <h2 class="confirm-title" id="confirmTitle">確認</h2>
        <p class="confirm-desc" id="confirmDesc"></p>
        <div class="confirm-actions" id="confirmActions">
          <button class="btn btn-primary" id="btnConfirmOk">確定</button>
          <button class="btn btn-outline" id="btnConfirmCancel">取消</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div class="connection-status" id="connectionStatus">已連線</div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
